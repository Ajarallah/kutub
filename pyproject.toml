[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kutub"
version = "1.0.0"
description = "Index and search ebooks shared in Telegram channels"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ali Jarallah" }]
keywords = ["telegram", "ebooks", "kindle", "epub", "library", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["telethon>=1.34"]

[project.optional-dependencies]
kindle = ["stkclient>=0.1"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
kutub = "kutub.cli:main"

[project.urls]
Homepage = "https://github.com/Ajarallah/kutub"
Issues = "https://github.com/Ajarallah/kutub/issues"

[tool.setuptools]
packages = ["kutub"]
